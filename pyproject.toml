[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-blunder-journal"
version = "0.1.0"
description = "Turn post-game feelings into fixes: log blunders, tally phase heat, find recurring causes, get a five-minute drill plan."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["chess", "blunder", "journal", "drill", "training", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
blunder-journal = "blunder_journal.cli:main"

[tool.setuptools]
packages = ["blunder_journal"]
